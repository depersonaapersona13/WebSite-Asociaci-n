<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Página no encontrada · De Personas a Personas</title>
  <meta name="description" content="La página que buscas no existe. Vuelve al inicio de De Personas a Personas.">
  <meta name="theme-color" content="#8FB9E0">
  <meta name="robots" content="noindex">

  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/img/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">

  <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>

  <!-- Tema visual (modo oscuro) antes de pintar, para evitar el destello blanco -->
  <script src="/assets/js/tema-visual.js"></script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/assets/js/tema.js"></script>
  <link rel="stylesheet" href="/assets/css/styles.css">

  <!-- Selector de idioma (antes de main.js) + encabezado/pie compartidos + lógica general -->
  <script src="/assets/js/idiomas.js" defer></script>
  <script src="/assets/js/layout.js" defer></script>
  <script src="/assets/js/main.js" defer></script>
</head>

<body data-pagina="404" class="flex min-h-screen flex-col bg-white text-brand-900 antialiased">
  <a class="salto-contenido" href="#contenido" data-i18n="comun.saltar">Saltar al contenido</a>

  <noscript>
    <div class="border-b border-brand-100 bg-brand-50 px-4 py-3 text-sm sm:px-6">
      <a class="enlace mr-5 font-semibold" href="/">Inicio</a>
      <a class="enlace mr-5 font-semibold" href="/sobre-nosotros">Sobre Nosotros</a>
      <a class="enlace mr-5 font-semibold" href="/proyectos">Proyectos</a>
      <a class="enlace font-semibold" href="/contacto">Contacto</a>
    </div>
  </noscript>

  <div data-layout="header" hidden></div>

  <main id="contenido" class="flex flex-1 items-center justify-center px-4 py-20 sm:px-6">
    <div class="mx-auto max-w-xl text-center">
      <p class="text-sm font-bold uppercase tracking-widest text-brand-700" data-i18n="error404.kicker">Error 404</p>
      <h1 class="mt-3 text-3xl font-bold text-brand-900 sm:text-4xl" data-i18n="error404.titulo">Esta página no existe</h1>
      <p class="mt-4 text-brand-900/80" data-i18n="error404.texto">
        Puede que el enlace esté mal escrito o que la hayamos movido. Desde aquí vuelves
        a los sitios con contenido:
      </p>
      <div class="mt-8 flex flex-wrap justify-center gap-3">
        <a class="btn btn-primario" href="/" data-i18n="error404.cta1">Volver al inicio</a>
        <a class="btn btn-secundario" href="/proyectos" data-i18n="error404.cta2">Ver proyectos</a>
        <a class="btn btn-secundario" href="/contacto" data-i18n="error404.cta3">Contacto</a>
      </div>
    </div>
  </main>

  <div data-layout="footer" hidden></div>
</body>
</html>
